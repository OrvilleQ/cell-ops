apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: talos-backup
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  path: ./kubernetes/apps/talos-backup/talos-backup/app
  prune: true
  wait: false
  targetNamespace: talos-backup
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
