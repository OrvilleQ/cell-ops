apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nginx-gateway-public
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/nginx-gateway/nginx-gateway-fabric/gateway
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: nginx-gateway
  timeout: 5m
  dependsOn:
    - name: nginx-gateway-fabric
