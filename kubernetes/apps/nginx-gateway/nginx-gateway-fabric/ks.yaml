apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nginx-gateway-fabric
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/nginx-gateway/nginx-gateway-fabric/app
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: nginx-gateway
  timeout: 5m
  dependsOn:
    - name: gateway-api
    - name: gvisor
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: nginx-gateway-fabric
      namespace: nginx-gateway
