apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: topolvm
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/topolvm-system/topolvm/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: topolvm-system
  wait: false
  dependsOn:
    - name: snapshot-controller
