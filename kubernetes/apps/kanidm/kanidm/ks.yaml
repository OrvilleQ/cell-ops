apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-certificate
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/kanidm/kanidm/certificate
  prune: true
  wait: false
  targetNamespace: kanidm
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cert-manager-issuers
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: kanidm
      namespace: kanidm

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/kanidm/kanidm/app
  prune: true
  wait: false
  targetNamespace: kanidm
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: topolvm
    - name: kanidm-certificate
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kanidm
      namespace: kanidm

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-public
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/kanidm/kanidm/route
  prune: true
  wait: false
  targetNamespace: kanidm
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: kanidm
    - name: envoy-gateway-public
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-backup
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/kanidm/kanidm/backup
  prune: true
  wait: false
  targetNamespace: kanidm
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: kanidm
    - name: kopiur-repository
