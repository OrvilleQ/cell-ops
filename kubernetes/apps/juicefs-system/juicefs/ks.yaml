apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: juicefs
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/juicefs-system/juicefs/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: juicefs-system
  wait: false
  dependsOn:
    - name: topolvm
      namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
