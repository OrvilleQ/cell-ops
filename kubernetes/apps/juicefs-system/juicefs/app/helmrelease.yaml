apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: juicefs
spec:
  interval: 1h
  chart:
    spec:
      chart: juicefs-csi-driver
      version: 0.33.1
      sourceRef:
        kind: HelmRepository
        name: juicefs
      interval: 1h
  values:
    immutable: true
    mountMode: mountpod
    csidriver:
      disableHooks: true
    controller:
      replicas: 1
      nodeSelector:
        kubernetes.io/hostname: vie10
    node:
      nodeSelector:
        kubernetes.io/hostname: vie10
    dashboard:
      enabled: false
    snapshot:
      enabled: false
    defaultMountImage:
      ce: juicedata/mount:ce-v1.4.1
    globalConfig:
      enabled: true
      manageByHelm: true
      enableNodeSelector: true
      mountPodPatch:
        - cacheDirs:
            - type: PVC
              name: juicefs-cache-vie10
          mountOptions:
            - cache-size=307200
            - free-space-ratio=0.05
            - buffer-size=64
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
