apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-public
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  path: ./kubernetes/apps/envoy-gateway-system/envoy-gateway/gateway
  prune: true
  wait: false
  targetNamespace: envoy-gateway-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: envoy-gateway
    - name: envoy-gateway-certificate
    - name: kanidm-certificate
    - name: portal-certificate
    - name: microtalk-certificate
  decryption:
    provider: sops
    secretRef:
      name: sops-age
