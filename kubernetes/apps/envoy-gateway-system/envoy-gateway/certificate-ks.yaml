apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-certificate
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  path: ./kubernetes/apps/envoy-gateway-system/envoy-gateway/certificate
  prune: true
  wait: false
  targetNamespace: envoy-gateway-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cert-manager-issuers
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: public
      namespace: envoy-gateway-system
