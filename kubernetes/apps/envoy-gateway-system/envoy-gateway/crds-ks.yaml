apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-crds
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  path: ./kubernetes/apps/envoy-gateway-system/envoy-gateway/crds
  prune: false
  wait: true
  targetNamespace: envoy-gateway-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: gateway-api
