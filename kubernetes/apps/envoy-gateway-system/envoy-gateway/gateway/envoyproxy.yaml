apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public
spec:
  concurrency: 1
  provider:
    type: Kubernetes
    kubernetes:
      useListenerPortAsContainerPort: false
      envoyService:
        type: ClusterIP
      envoyDeployment:
        name: public-envoy
        replicas: 1
        strategy:
          type: Recreate
        pod:
          nodeSelector:
            workload-role: edge
          tolerations:
            - key: dedicated
              operator: Equal
              value: edge
              effect: NoSchedule
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: envoy
                      ports:
                        - name: http
                          containerPort: 10080
                          hostPort: 80
                          protocol: TCP
                        - name: https
                          containerPort: 10443
                          hostPort: 443
                          protocol: TCP
                        - name: ssh
                          containerPort: 10022
                          hostPort: 22
                          protocol: TCP
                        - name: smtp
                          containerPort: 10025
                          hostPort: 25
                          protocol: TCP
                        - name: pop3
                          containerPort: 10110
                          hostPort: 110
                          protocol: TCP
                        - name: imap
                          containerPort: 10143
                          hostPort: 143
                          protocol: TCP
                        - name: submissions
                          containerPort: 10465
                          hostPort: 465
                          protocol: TCP
                        - name: submission
                          containerPort: 10587
                          hostPort: 587
                          protocol: TCP
                        - name: imaps
                          containerPort: 10993
                          hostPort: 993
                          protocol: TCP
                        - name: pop3s
                          containerPort: 10995
                          hostPort: 995
                          protocol: TCP
                        - name: sieve
                          containerPort: 4190
                          hostPort: 4190
                          protocol: TCP
