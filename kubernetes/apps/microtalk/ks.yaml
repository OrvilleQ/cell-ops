apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: microtalk-certificate
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  path: ./kubernetes/apps/microtalk/certificate
  targetNamespace: microtalk
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cert-manager-issuers
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: talk
      namespace: microtalk

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: microtalk
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  path: ./kubernetes/apps/microtalk/app
  targetNamespace: microtalk
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn: []
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: mirotalk
      namespace: microtalk
    - apiVersion: apps/v1
      kind: Deployment
      name: coturn
      namespace: microtalk

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: microtalk-public
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  path: ./kubernetes/apps/microtalk/route
  targetNamespace: microtalk
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: microtalk
    - name: microtalk-certificate
    - name: envoy-gateway-public
