apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coturn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coturn
      annotations:
        config.digest: 15aefc5dba91c40b54d8b012eb815c06433d3e55a5b7964a1c5573116a8a3c12
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload-role: edge
      tolerations:
        - key: dedicated
          operator: Equal
          value: edge
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coturn
          image: docker.io/coturn/coturn:latest@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
          command:
            - turnserver
          args:
            - -c
            - /etc/coturn/turnserver.conf
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          ports:
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turn-tcp
              containerPort: 3478
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/coturn
              readOnly: true
          startupProbe:
            tcpSocket:
              port: 3478
              host: ENC[AES256_GCM,data:jwMK32zUMeW1ibYb4axE,iv:IsEStKfEaMGaylpZQyJ3nZvuN+WC8kciL+jL81lBCcw=,tag:zy8QTojKZSMLvox98LqhYA==,type:str]
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 3478
              host: ENC[AES256_GCM,data:LtvitrLvJnj/WbDJsH0e,iv:t+m4T3CMjlK2esGsBd6AqRQmUH8NmIafxuRSTAeugIQ=,tag:Sjk9LbjnaWXG4VgRXfKa5Q==,type:str]
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: config
          secret:
            secretName: talk-turn-config
            defaultMode: 288
      terminationGracePeriodSeconds: 30
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
