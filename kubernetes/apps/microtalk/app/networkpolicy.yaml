apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mirotalk-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mirotalk
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: public
      ports:
        - protocol: TCP
          port: 3000
