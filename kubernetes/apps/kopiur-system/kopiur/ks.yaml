---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/kopiur-system/kopiur/app
  prune: true
  wait: false
  targetNamespace: kopiur-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: snapshot-controller
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kopiur
      namespace: kopiur-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-repository
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/kopiur-system/kopiur/repository
  prune: true
  wait: false
  targetNamespace: kopiur-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: kopiur
  decryption:
    provider: sops
    secretRef:
      name: sops-age
