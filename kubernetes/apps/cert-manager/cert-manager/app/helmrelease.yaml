apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 1h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  chartRef:
    kind: OCIRepository
    name: cert-manager
  values:
    crds:
      enabled: true
      keep: true
    global:
      nodeSelector:
        workload-role: compute
    replicaCount: 1
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      gatewayAPI:
        enabled: true
    dns01RecursiveNameservers: 1.1.1.1:53,1.0.0.1:53
    dns01RecursiveNameserversOnly: true
    extraArgs:
      - --acme-http01-solver-nameservers=1.1.1.1:53,1.0.0.1:53
    prometheus:
      enabled: true
      servicemonitor:
        enabled: false
