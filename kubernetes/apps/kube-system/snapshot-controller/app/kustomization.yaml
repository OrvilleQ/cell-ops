apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.7.0/deploy/kubernetes/snapshot-controller/rbac-snapshot-controller.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.7.0/deploy/kubernetes/snapshot-controller/setup-snapshot-controller.yaml
images:
  - name: registry.k8s.io/sig-storage/snapshot-controller
    newTag: v8.7.0
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: snapshot-controller
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: snapshot-controller
      spec:
        replicas: 1
        template:
          spec:
            nodeSelector:
              workload-role: compute
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: snapshot-controller
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
                resources:
                  requests:
                    cpu: 25m
                    memory: 64Mi
                  limits:
                    memory: 256Mi
