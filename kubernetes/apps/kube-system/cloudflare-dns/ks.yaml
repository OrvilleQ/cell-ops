apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-dns
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  path: ./kubernetes/apps/kube-system/cloudflare-dns/app
  prune: true
  wait: false
  targetNamespace: kube-system
  dependsOn:
    - name: gateway-api
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudflare-dns
      namespace: kube-system
