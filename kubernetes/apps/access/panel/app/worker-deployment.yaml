apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-worker
  annotations:
    secret.reloader.stakater.com/reload: panel-worker-bootstrap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-worker
      annotations:
        access.cell-ops/rebuild-revision: restart-test-6a886b011c26edfe
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: dedicated
          operator: Equal
          value: edge
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
        - image: ${PANEL_IMAGE}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: runtime
              mountPath: /runtime
            - name: logs
              mountPath: /logs
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          name: panel-worker
          command:
            - /bin/sh
            - /bootstrap/start.sh
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8080
            - name: stream
              containerPort: 8082
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: bootstrap
          secret:
            secretName: panel-worker-bootstrap
            defaultMode: 288
        - name: runtime
          emptyDir:
            sizeLimit: 16Mi
        - name: logs
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      nodeSelector:
        workload-role: edge
