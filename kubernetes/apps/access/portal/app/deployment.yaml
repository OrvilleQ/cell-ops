apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  annotations:
    secret.reloader.stakater.com/reload: portal-source,portal-config
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
        kanidm-ldap-client: "true"
    spec:
      nodeSelector:
        workload-role: edge
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: ghcr.io/orvilleq/portal-runtime:0.0.3@sha256:74c3bf320ef13d787b8b8c5f2a123ceb71cef58eee918683e3b9229370ed0ea2
          env:
            - name: PORTAL_CONFIG
              value: /config/config.json
            - name: GUNICORN_CMD_ARGS
              value: --no-control-socket
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          secret:
            secretName: portal-source
            defaultMode: 288
        - name: config
          secret:
            secretName: portal-config
            defaultMode: 288
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      tolerations:
        - key: dedicated
          operator: Equal
          value: edge
          effect: NoSchedule
