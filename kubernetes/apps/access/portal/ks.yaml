apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portal-certificate
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/access/portal/certificate
  targetNamespace: access
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cert-manager-issuers
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: portal
      namespace: access

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portal
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/access/portal/app
  targetNamespace: access
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: kanidm
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: portal
      namespace: access

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portal-public
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/access/portal/route
  targetNamespace: access
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: portal
    - name: portal-certificate
    - name: envoy-gateway-public
  decryption:
    provider: sops
    secretRef:
      name: sops-age
