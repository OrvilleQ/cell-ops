apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulwark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bulwark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulwark
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1001
      containers:
        - name: bulwark
          image: ghcr.io/bulwarkmail/webmail:1.21.1@sha256:53df0683b2c59870611073b425937999c859b3a51106ecda08ed41ee12d97a7d
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: bulwark-runtime
          env:
            - name: TRUSTED_PROXY_DEPTH
              value: "1"
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
              readOnly: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bulwark-data
