apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mail-certificates
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/mail/certificates
  targetNamespace: mail
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: false
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: mail-web-tls
      namespace: mail
  dependsOn:
    - name: cert-manager-issuers
---
