apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-monitors
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  path: ./kubernetes/apps/observability/kube-prometheus-stack/monitors
  prune: true
  wait: false
  targetNamespace: observability
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: kube-prometheus-stack
