apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kopiur
spec:
  namespaceSelector:
    matchNames:
      - kopiur-system
  selector:
    matchLabels:
      app.kubernetes.io/name: kopiur
      app.kubernetes.io/component: controller
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: node
