apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: topolvm-node
spec:
  namespaceSelector:
    matchNames:
      - topolvm-system
  selector:
    matchLabels:
      app.kubernetes.io/name: topolvm
      app.kubernetes.io/component: node
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: node
