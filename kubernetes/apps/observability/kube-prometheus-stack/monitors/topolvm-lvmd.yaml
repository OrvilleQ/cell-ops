apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: topolvm-lvmd
spec:
  namespaceSelector:
    matchNames:
      - topolvm-system
  selector:
    matchLabels:
      app.kubernetes.io/name: topolvm
      app.kubernetes.io/component: lvmd
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: node
