apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-crds
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  path: ./kubernetes/apps/observability/kube-prometheus-stack/crds
  prune: false
  wait: true
  targetNamespace: observability
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
