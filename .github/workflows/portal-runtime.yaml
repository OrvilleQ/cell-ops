name: Portal runtime
on:
  push:
    branches: [main]
    paths:
      - apps/portal/runtime/**
      - .github/workflows/portal-runtime.yaml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat apps/portal/runtime/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portal-runtime:${version}" >> "$GITHUB_ENV"
      - name: Log in
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runtime only
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/portal/runtime
          push: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
