---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flate"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Flate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          include_deleted_files: true
          patterns: |
            kubernetes/**/*
            bootstrap/**/*
            talos/topf.yaml
            .mise/**/*
            .github/workflows/flate.yaml

  flate:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup mise tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: helm helmfile kustomize yq lefthook

      - name: Build repository entry point
        run: kustomize build kubernetes/apps > "$RUNNER_TEMP/cell-apps.yaml"

      - name: Install Flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5

      - name: Run Flate
        id: flate
        run: |
          KUBE_VERSION="$(yq -r '.kubernetesVersion' talos/topf.yaml)"
          flate test all -p ./kubernetes/apps --kube-version "$KUBE_VERSION"

      - name: Render bootstrap releases
        run: |
          KUBE_VERSION="$(yq -r '.kubernetesVersion' talos/topf.yaml)"
          helmfile --file bootstrap/helmfile/apps.yaml template --kube-version "$KUBE_VERSION" > "$RUNNER_TEMP/cell-bootstrap.yaml"

  success:
    if: ${{ !cancelled() }}
    needs: [filter, flate]
    name: Flate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
